[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claudia-chatterley"
version = "0.1.0"
description = "Voice-to-text companion for Claude Cowork and any macOS app. Speak instead of type."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Severin Sorensen", email = "sev@epraxis.com"},
]
keywords = ["voice", "speech-to-text", "whisper", "claude", "cowork", "dictation", "transcription"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing",
]
dependencies = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "pyperclip>=1.8.2",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-Quartz>=10.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
groq = ["groq>=0.4.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
]

[project.scripts]
claudia = "claudia.__main__:main"

[project.urls]
Homepage = "https://github.com/sevsorensen/claudia-chatterley"
Repository = "https://github.com/sevsorensen/claudia-chatterley"
Issues = "https://github.com/sevsorensen/claudia-chatterley/issues"

[tool.setuptools.packages.find]
include = ["claudia*"]

[tool.ruff]
line-length = 100
target-version = "py310"
